- name: "Debian 11+ required"
  assert:
    that:
      - ansible_facts['distribution'] == "Debian"
      - ansible_facts['distribution_major_version'] is version('11','>=')
    msg: "Only Debian 11+ is supported, this is {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_major_version'] }}"

- name: "check that variable msmtp_root_email_address is defined"
  assert:
    that:
      - msmtp_root_email_address is defined
    msg: "Define variable msmtp_root_email_address !"
    quiet: true

- name: "install msmtp-mta package"
  package:
    name: msmtp-mta
    state: present

- name: "enable msmtpd after reboot"
  systemd:
    name: msmtpd
    enabled: yes

- name: "make msmtp to listen on selected IP address"
  lineinfile:
    state: present
    path: /etc/default/msmtpd
    create: true
    owner: root
    group: root
    mode: '0644'
    regexp: '^INTERFACE='
    line: "INTERFACE={{ msmtp_listen_interface }}"
  register: etc_default_msmtpd

- name: "create root line in /etc/aliases"
  lineinfile:
    state: present
    path: /etc/aliases
    create: true
    owner: root
    group: root
    mode: '0644'
    regexp: '^root:'
    line: "root: {{ msmtp_root_email_address }}"
  notify: "run newaliases"
  tags:
    - aliases

- name: "create default line in /etc/aliases"
  lineinfile:
    state: present
    path: /etc/aliases
    create: true
    owner: root
    group: root
    mode: '0644'
    regexp: '^default:'
    line: "default: {{ msmtp_aliases_default }}"
  notify: "run newaliases"
  tags:
    - aliases

- name: "create msmtp config"
  template:
    dest: /etc/msmtprc
    src: msmtprc.j2
    owner: root
    group: msmtp
    mode: '0640'
  register: etc_msmtprc

- name: "restart msmtpd if config was changed"
  when: etc_default_msmtpd.changed or etc_msmtprc.changed
  service:
    name: msmtpd
    state: restarted

# with msmtp, mailutils do not work for local names, bsd-mailx must be used
- name: "install bsd-mailx package"
  package:
    name: bsd-mailx
    state: present

- community.general.alternatives:
    name: mailx
    path: /usr/bin/bsd-mailx
    state: selected

- name: "flush handlers"
  meta: flush_handlers
